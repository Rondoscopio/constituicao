name: Validar documentação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verificar arquivos e links internos
        run: python3 scripts/validar_documentacao.py
      - name: Verificar documento unificado e índice
        run: node scripts/gerar_documento.mjs --check

# Aplicado ao CodeQL default setup pela custom property:
# github-codeql-config-file = ./.github/codeql/codeql-config.yml
name: Rondoscópio CodeQL

# Incluir diretórios completos, não globs de arquivos.
# Isso permite analisar os scripts em .tools/ sem modificar a raiz.
paths:
  - ".tools"
  - ".config"
  - ".github/workflows"

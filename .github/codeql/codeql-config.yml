# Aplicar ao CodeQL default setup pela propriedade do repositório:
# github-codeql-config-file = ./.github/codeql/codeql-config.yml
#
# A análise automática precisa incluir explicitamente os arquivos-fonte
# preservados em diretórios ocultos, como .tools/.
name: Rondoscópio CodeQL

paths:
  - .tools/scripts/**
  - .tools/tests/**
  - .config/eslint.config.mjs
  - .github/workflows/**
